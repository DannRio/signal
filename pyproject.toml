[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "market-signal-bot"
version = "1.0.0"
description = "Standalone multi-timeframe bullish/bearish market-regime and trade-signal engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "DannRio"}]
dependencies = [
    "ccxt>=4.4,<5",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "ruff>=0.8,<1",
]

[project.scripts]
signal-bot = "signal_bot.cli:main"
signal-api = "signal_bot.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
