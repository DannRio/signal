name: Bootstrap professional signal machine v2

on:
  push:
    branches: ["feature/professional-signal-machine-v2"]
    paths:
      - ".github/workflows/bootstrap-v2.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify and import v2 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.* > /tmp/professional-v2.b64
          base64 --decode /tmp/professional-v2.b64 > /tmp/professional-v2.tar.gz
          echo "b5948b8b8c5f699799b2f9920d0427a8654378c296d21c1801a6d7da67bff15d  /tmp/professional-v2.tar.gz" | sha256sum -c -
          mkdir -p /tmp/signal-v2
          tar -xzf /tmp/professional-v2.tar.gz -C /tmp/signal-v2
          test -f /tmp/signal-v2/pyproject.toml
          test -f /tmp/signal-v2/src/signal_bot/machine_cli.py
          test -f /tmp/signal-v2/src/signal_bot/web/index.html
          rsync -a --exclude='.git/' --exclude='.github/' /tmp/signal-v2/ ./
          rm -rf .bootstrap

      - name: Commit professional machine implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Build professional signal machine v2"
          git push origin HEAD:feature/professional-signal-machine-v2
