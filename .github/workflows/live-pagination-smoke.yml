name: Verify KuCoin live pagination

on:
  push:
    branches: ["feature/kucoin-futures-only"]
    paths:
      - ".github/workflows/live-pagination-smoke.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify real KuCoin Futures pagination and analysis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from signal_bot.models import to_dict
          from signal_bot.service import LiveMarketRequest, RegimeBotService

          request = LiveMarketRequest(
              exchange_id="kucoinfutures",
              market_type="swap",
              symbol="BTC/USDT:USDT",
              execution_timeframe="15m",
              context_timeframes=("1h", "4h"),
              limit=500,
              closed_candles_only=True,
              # This connectivity verification isolates pagination from the
              # production freshness policy. Normal operation keeps 3 bars.
              maximum_staleness_bars=0,
          )
          service = RegimeBotService()
          frames = service.fetch_frames(request)
          rows = {timeframe: len(frame) for timeframe, frame in frames.items()}
          assert rows == {"15m": 500, "1h": 500, "4h": 500}, rows
          assert all(frame["timestamp"].is_unique for frame in frames.values())
          assert all(frame["timestamp"].is_monotonic_increasing for frame in frames.values())

          signal = service.analyze_live(
              request,
              equity=10_000.0,
              risk_percent=0.5,
              maximum_notional_multiple=1.0,
          )
          payload = to_dict(signal)
          states = {item["timeframe"] for item in payload["timeframe_states"]}
          assert states == {"15m", "1h", "4h"}, payload
          assert payload["action"] in {
              "long", "short", "watch_long", "watch_short", "no_trade"
          }
          print(
              {
                  "rows": rows,
                  "action": payload["action"],
                  "regime": payload["regime"],
                  "states": sorted(states),
              }
          )
          PY

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/live-pagination-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time KuCoin live pagination verification"
          git push origin HEAD:feature/kucoin-futures-only
