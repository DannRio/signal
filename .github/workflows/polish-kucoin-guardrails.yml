name: Polish KuCoin Futures guardrails

on:
  push:
    branches: ["feature/kucoin-futures-only"]
    paths:
      - ".github/workflows/polish-kucoin-guardrails.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Recover and apply guardrail script
        shell: bash
        run: |
          set -euo pipefail
          git show b9fe9b27c92aab822e47facb7c55759aa9ed9241:.github/workflows/polish-kucoin-guardrails.yml > /tmp/original-workflow.yml
          awk '
            /python - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' /tmp/original-workflow.yml > /tmp/polish-kucoin-guardrails.py
          python /tmp/polish-kucoin-guardrails.py

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check src tests --fix
          python -m ruff check src tests
          python -m pytest -q
          python -m compileall -q src tests
          signal-bot --help >/dev/null
          signal-machine --help >/dev/null
          signal-api --help >/dev/null

      - name: Commit guardrails
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/polish-kucoin-guardrails.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden KuCoin Futures request guardrails"
          git push origin HEAD:feature/kucoin-futures-only
