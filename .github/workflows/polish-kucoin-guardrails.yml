name: Polish KuCoin Futures guardrails

on:
  push:
    branches: ["feature/kucoin-futures-only"]
    paths:
      - ".github/workflows/polish-kucoin-guardrails.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply guardrails
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          venue = '''from __future__ import annotations

import math

DEFAULT_EXCHANGE_ID = "kucoinfutures"
DEFAULT_MARKET_TYPE = "swap"
DEFAULT_SYMBOL = "BTC/USDT:USDT"
DEFAULT_QUOTE_CURRENCIES = ("USDT",)
KUCOIN_MAX_KLINE_LIMIT = 500
MAX_NOTIONAL_MULTIPLE = 5.0


class VenueConfigurationError(ValueError):
    """Raised when a user-facing request escapes the KuCoin Futures scope."""


def normalize_exchange_id(value: str | None = None) -> str:
    normalized = (value or DEFAULT_EXCHANGE_ID).strip().lower()
    normalized = {
        "kucoin-futures": DEFAULT_EXCHANGE_ID,
        "kucoin_futures": DEFAULT_EXCHANGE_ID,
    }.get(normalized, normalized)
    if normalized != DEFAULT_EXCHANGE_ID:
        raise VenueConfigurationError(
            "This signal project is restricted to KuCoin Futures. "
            "Use exchange_id='kucoinfutures'."
        )
    return normalized


def normalize_market_type(value: str | None = None) -> str:
    normalized = (value or DEFAULT_MARKET_TYPE).strip().lower()
    if normalized in {"perp", "perpetual"}:
        normalized = DEFAULT_MARKET_TYPE
    if normalized != DEFAULT_MARKET_TYPE:
        raise VenueConfigurationError(
            "This signal project supports KuCoin USDT-margined perpetual "
            "swaps only. Use market_type='swap'."
        )
    return normalized


def enforce_venue(
    exchange_id: str | None = None,
    market_type: str | None = None,
) -> tuple[str, str]:
    return normalize_exchange_id(exchange_id), normalize_market_type(market_type)


def normalize_symbol(value: str) -> str:
    symbol = str(value).strip().upper().replace(" ", "")
    if not symbol:
        raise VenueConfigurationError("symbol cannot be empty.")
    if ":" in symbol:
        pair, settle = symbol.split(":", 1)
    else:
        pair, settle = symbol, "USDT"
    if "/" not in pair:
        raise VenueConfigurationError(
            "Use CCXT futures notation such as BTC/USDT:USDT. KuCoin raw "
            "contract IDs such as XBTUSDTM are not accepted."
        )
    base, quote = pair.split("/", 1)
    if not base or quote != "USDT" or settle != "USDT":
        raise VenueConfigurationError(
            "Only KuCoin USDT-margined perpetual symbols are supported, "
            "for example BTC/USDT:USDT."
        )
    return f"{base}/{quote}:{settle}"


def normalize_symbols(values: tuple[str, ...] | list[str]) -> tuple[str, ...]:
    return tuple(dict.fromkeys(normalize_symbol(value) for value in values))


def validate_kline_limit(value: int | str) -> int:
    limit = int(value)
    if not 1 <= limit <= KUCOIN_MAX_KLINE_LIMIT:
        raise VenueConfigurationError(
            f"KuCoin Futures candle requests must be between 1 and "
            f"{KUCOIN_MAX_KLINE_LIMIT}."
        )
    return limit


def validate_notional_multiple(
    value: float | str | None,
) -> float | None:
    if value is None or value == "":
        return None
    multiple = float(value)
    if not math.isfinite(multiple) or not 0 < multiple <= MAX_NOTIONAL_MULTIPLE:
        raise VenueConfigurationError(
            "maximum_notional_multiple must be greater than 0 and no more "
            f"than {MAX_NOTIONAL_MULTIPLE}. It is a notional-to-equity cap, "
            "not an exchange leverage setting."
        )
    return multiple
'''
          Path("src/signal_bot/venue.py").write_text(venue, encoding="utf-8")

          def replace(path: str, old: str, new: str, count: int = -1) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              if old not in source:
                  raise RuntimeError(f"Expected text not found in {path}: {old!r}")
              target.write_text(source.replace(old, new, count), encoding="utf-8")

          replace(
              "src/signal_bot/machine_cli.py",
              "    KUCOIN_MAX_KLINE_LIMIT,\n",
              "    KUCOIN_MAX_KLINE_LIMIT,\n    validate_kline_limit,\n    validate_notional_multiple,\n",
          )
          replace(
              "src/signal_bot/machine_cli.py",
              '    parser.add_argument("--limit", type=int, default=500)\n',
              '    parser.add_argument(\n        "--limit",\n        type=validate_kline_limit,\n        default=KUCOIN_MAX_KLINE_LIMIT,\n    )\n',
          )
          replace(
              "src/signal_bot/machine_cli.py",
              '    parser.add_argument("--maximum-notional-multiple", type=float, default=None)\n',
              '    parser.add_argument(\n        "--maximum-notional-multiple",\n        type=validate_notional_multiple,\n        default=None,\n        help="Position-notional cap as a multiple of equity; does not set KuCoin leverage.",\n    )\n',
          )

          replace(
              "src/signal_bot/cli.py",
              "    normalize_symbol,\n",
              "    KUCOIN_MAX_KLINE_LIMIT,\n    normalize_symbol,\n    validate_kline_limit,\n    validate_notional_multiple,\n",
          )
          replace(
              "src/signal_bot/cli.py",
              '        type=float,\n        default=None,\n    )\n    backtest.add_argument("--json", action="store_true")',
              '        type=validate_notional_multiple,\n        default=None,\n        help="Position-notional cap as a multiple of equity; not exchange leverage.",\n    )\n    backtest.add_argument("--json", action="store_true")',
              count=1,
          )
          replace(
              "src/signal_bot/cli.py",
              '    parser.add_argument("--limit", type=int, default=500)\n',
              '    parser.add_argument(\n        "--limit",\n        type=validate_kline_limit,\n        default=KUCOIN_MAX_KLINE_LIMIT,\n    )\n',
          )
          replace(
              "src/signal_bot/cli.py",
              '        type=float,\n        default=None,\n    )\n    parser.add_argument(\n        "--include-open-candle",',
              '        type=validate_notional_multiple,\n        default=None,\n        help="Position-notional cap as a multiple of equity; not exchange leverage.",\n    )\n    parser.add_argument(\n        "--include-open-candle",',
              count=1,
          )

          replace(
              "src/signal_bot/api.py",
              "    normalize_symbols,\n",
              "    normalize_symbols,\n    validate_kline_limit,\n    validate_notional_multiple,\n",
          )
          replace(
              "src/signal_bot/api.py",
              '        limit: int = Query(500, ge=1, le=5000),\n',
              '        limit: int = Query(KUCOIN_MAX_KLINE_LIMIT, ge=1, le=KUCOIN_MAX_KLINE_LIMIT),\n',
          )
          replace(
              "src/signal_bot/api.py",
              '        maximum_notional_multiple: float | None = Query(None, gt=0),\n',
              '        maximum_notional_multiple: float | None = Query(None, gt=0, le=5.0),\n',
          )
          replace(
              "src/signal_bot/api.py",
              '_optional_float(\n                    payload, "maximum_notional_multiple"\n                )',
              'validate_notional_multiple(\n                    payload.get("maximum_notional_multiple")\n                )',
          )
          replace(
              "src/signal_bot/api.py",
              '                    limit=int(payload.get("limit", 500)),\n',
              '                    limit=validate_kline_limit(\n                        payload.get("limit", KUCOIN_MAX_KLINE_LIMIT)\n                    ),\n',
          )
          replace(
              "src/signal_bot/api.py",
              '                    limit=min(\n                        int(payload.get("limit", KUCOIN_MAX_KLINE_LIMIT)),\n                        KUCOIN_MAX_KLINE_LIMIT,\n                    ),\n',
              '                    limit=validate_kline_limit(\n                        payload.get("limit", KUCOIN_MAX_KLINE_LIMIT)\n                    ),\n',
          )
          replace(
              "src/signal_bot/api.py",
              '        limit=int(payload.get("limit", 500)),\n',
              '        limit=validate_kline_limit(\n            payload.get("limit", KUCOIN_MAX_KLINE_LIMIT)\n        ),\n',
          )
          replace(
              "src/signal_bot/api.py",
              '        limit=min(\n            int(payload.get("download_limit", KUCOIN_MAX_KLINE_LIMIT)),\n            KUCOIN_MAX_KLINE_LIMIT,\n        ),\n',
              '        limit=validate_kline_limit(\n            payload.get("download_limit", KUCOIN_MAX_KLINE_LIMIT)\n        ),\n',
          )
          replace(
              "src/signal_bot/api.py",
              '                symbol=str(payload["symbol"]),\n',
              '                symbol=normalize_symbol(str(payload["symbol"])),\n',
          )
          replace(
              "src/signal_bot/api.py",
              "            chart_bars = max(50, min(chart_bars, 1000))\n",
              "            chart_bars = max(50, min(chart_bars, KUCOIN_MAX_KLINE_LIMIT))\n",
          )

          replace(
              "src/signal_bot/scanner.py",
              '    market_type: str = "spot"\n',
              '    market_type: str = "swap"\n',
          )
          replace(
              "src/signal_bot/scanner.py",
              '    quote_currencies: tuple[str, ...] = ("USDT", "USD")\n',
              '    quote_currencies: tuple[str, ...] = ("USDT",)\n',
          )
          replace(
              "src/signal_bot/scanner.py",
              "    minimum_quote_volume: float = 0.0\n",
              "    minimum_quote_volume: float = 1_000_000.0\n",
          )
          replace(
              "src/signal_bot/scanner.py",
              "    maximum_spread_bps: float | None = 75.0\n",
              "    maximum_spread_bps: float | None = 25.0\n",
          )
          replace(
              "src/signal_bot/scanner.py",
              '        if self.limit <= 0 or self.limit > 5000:\n            raise ValueError("limit must be between 1 and 5000.")\n',
              '        if self.limit <= 0 or self.limit > 500:\n            raise ValueError("KuCoin Futures limit must be between 1 and 500.")\n',
          )

          replace(
              "src/signal_bot/web/index.html",
              "<label>Max effective leverage<input id=\"liveLeverage\" type=\"number\" value=\"1\" min=\"1\" max=\"5\" step=\"0.5\"></label>",
              "<label>Notional cap (× equity)<input id=\"liveLeverage\" type=\"number\" value=\"1\" min=\"0.1\" max=\"5\" step=\"0.1\"></label>",
          )
          replace(
              "src/signal_bot/web/index.html",
              "      </div>\n\n      <div id=\"liveLoading\"",
              "      </div>\n      <div class=\"message info\"><strong>Sizing note:</strong> the notional cap limits modeled position value relative to equity. It does not set leverage on KuCoin, convert base quantity to contracts, or calculate liquidation price.</div>\n\n      <div id=\"liveLoading\"",
              count=1,
          )
          replace(
              "src/signal_bot/web/index.html",
              "<label>Max effective leverage<input id=\"btLeverage\" type=\"number\" value=\"1\" min=\"1\" max=\"5\" step=\"0.5\"></label>",
              "<label>Notional cap (× equity)<input id=\"btLeverage\" type=\"number\" value=\"1\" min=\"0.1\" max=\"5\" step=\"0.1\"></label>",
          )
          replace(
              "src/signal_bot/web/index.html",
              "Historical funding settlements are not yet applied to P&amp;L, so a pass remains incomplete for live futures use.",
              "Historical funding settlements, contract-lot rounding, maintenance margin, and liquidation price are not yet applied, so a pass remains incomplete for live futures use.",
          )
          replace(
              "src/signal_bot/web/app.js",
              '["Position size", number(plan.position_size, 8)],',
              '["Base-asset quantity", number(plan.position_size, 8)],',
          )

          readme = Path("README.md")
          source = readme.read_text(encoding="utf-8")
          anchor = "Historical funding settlements are not yet deducted from trade P&L, so no validation result should be treated as complete evidence for live futures deployment until funding is modeled."
          replacement = anchor + " The `maximum_notional_multiple` setting is only a modeled notional-to-equity cap; it does not change leverage on KuCoin, round to contract lots, or estimate liquidation."
          if anchor not in source:
              raise RuntimeError("README guardrail anchor not found")
          readme.write_text(source.replace(anchor, replacement, 1), encoding="utf-8")

          tests = Path("tests/test_kucoin_futures_scope.py")
          test_source = tests.read_text(encoding="utf-8")
          test_source = test_source.replace(
              "    normalize_symbol,\n)",
              "    normalize_symbol,\n    validate_kline_limit,\n    validate_notional_multiple,\n)",
          )
          test_source += '''\n\ndef test_kucoin_request_and_notional_caps() -> None:\n    assert validate_kline_limit(500) == 500\n    assert validate_notional_multiple(5) == 5.0\n    with pytest.raises(VenueConfigurationError):\n        validate_kline_limit(501)\n    with pytest.raises(VenueConfigurationError):\n        validate_notional_multiple(5.01)\n'''
          tests.write_text(test_source, encoding="utf-8")
          PY

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check src tests --fix
          python -m ruff check src tests
          python -m pytest -q
          python -m compileall -q src tests
          signal-bot --help >/dev/null
          signal-machine --help >/dev/null
          signal-api --help >/dev/null

      - name: Commit guardrails
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/polish-kucoin-guardrails.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden KuCoin Futures request guardrails"
          git push origin HEAD:feature/kucoin-futures-only
