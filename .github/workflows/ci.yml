name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest -q
      - name: Dashboard JavaScript syntax
        run: node --check src/signal_bot/web/app.js
      - name: Compile
        run: python -m compileall -q src tests
      - name: CLI smoke tests
        run: |
          signal-bot --help
          signal-machine --help
          signal-api --help
      - name: Dashboard package-data smoke test
        run: python -c "from importlib.resources import files; assert files('signal_bot').joinpath('web','index.html').is_file()"
