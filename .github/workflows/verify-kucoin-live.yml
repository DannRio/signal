name: Verify KuCoin Futures live data

on:
  push:
    branches: ["feature/kucoin-futures-only"]
    paths:
      - ".github/workflows/verify-kucoin-live.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Enforce settlement filter
        run: python tools/enforce_kucoin_quote_scope.py

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check src tests tools --fix
          python -m ruff check src tests tools
          python -m pytest -q
          python -m compileall -q src tests tools

      - name: Smoke-test KuCoin Futures public data
        shell: bash
        run: |
          set -euo pipefail
          # This one-time diagnostic verifies exchange reachability, unified
          # symbols, three-timeframe Kline retrieval, and signal serialization.
          # Freshness is disabled only here; production retains the default
          # 3-bar fail-closed freshness gate.
          python - <<'PY'
          from signal_bot.models import to_dict
          from signal_bot.service import LiveMarketRequest, RegimeBotService

          request = LiveMarketRequest(
              exchange_id="kucoinfutures",
              market_type="swap",
              symbol="BTC/USDT:USDT",
              execution_timeframe="15m",
              context_timeframes=("1h", "4h"),
              limit=500,
              closed_candles_only=True,
              maximum_staleness_bars=0,
          )
          service = RegimeBotService()
          frames = service.fetch_frames(request)
          rows = {name: len(frame) for name, frame in frames.items()}
          print({"retrieved_rows": rows, "minimum_bars": service.engine.config.minimum_bars})
          assert set(frames) == {"15m", "1h", "4h"}
          assert all(count > 0 for count in rows.values())

          signal = service.analyze_live(
              request,
              equity=10_000.0,
              risk_percent=0.5,
          )
          payload = to_dict(signal)
          assert payload["symbol"] == "BTC/USDT:USDT"
          assert payload["execution_timeframe"] == "15m"
          assert payload["generated_at"]
          assert payload["action"] in {
              "long", "short", "watch_long", "watch_short", "no_trade"
          }
          assert isinstance(payload["timeframe_states"], list)
          print(
              {
                  "action": payload["action"],
                  "regime": payload["regime"],
                  "states": [
                      item["timeframe"]
                      for item in payload["timeframe_states"]
                  ],
                  "warnings": payload["warnings"],
              }
          )
          PY

      - name: Commit verified scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/enforce_kucoin_quote_scope.py
          rm -f .github/workflows/verify-kucoin-live.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Enforce KuCoin USDT perpetual universe"
          git push origin HEAD:feature/kucoin-futures-only
