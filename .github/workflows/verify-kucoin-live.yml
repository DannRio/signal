name: Verify KuCoin Futures live data

on:
  push:
    branches: ["feature/kucoin-futures-only"]
    paths:
      - ".github/workflows/verify-kucoin-live.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Enforce settlement filter
        run: python tools/enforce_kucoin_quote_scope.py

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check src tests tools --fix
          python -m ruff check src tests tools
          python -m pytest -q
          python -m compileall -q src tests tools

      - name: Smoke-test KuCoin Futures public data
        shell: bash
        run: |
          set -euo pipefail
          # This one-time test verifies exchange reachability, unified-symbol
          # resolution, Kline retrieval, and response schema. Freshness is
          # deliberately disabled only here because GitHub-hosted runners may
          # observe delayed exchange candles. Production keeps the 3-bar gate.
          signal-bot analyze \
            --exchange kucoinfutures \
            --market-type swap \
            --symbol BTC/USDT:USDT \
            --execution-timeframe 15m \
            --context-timeframes 1h,4h \
            --limit 500 \
            --maximum-staleness-bars 0 \
            --equity 10000 \
            --risk-percent 0.5 \
            --json > /tmp/kucoin-live-signal.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/kucoin-live-signal.json").read_text())
          assert payload["symbol"] == "BTC/USDT:USDT"
          assert payload["execution_timeframe"] == "15m"
          assert payload["generated_at"]
          assert payload["action"] in {
              "long", "short", "watch_long", "watch_short", "no_trade"
          }
          states = payload["timeframe_states"]
          assert len(states) == 3
          assert {item["timeframe"] for item in states} == {"15m", "1h", "4h"}
          PY

      - name: Commit verified scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/enforce_kucoin_quote_scope.py
          rm -f .github/workflows/verify-kucoin-live.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Enforce KuCoin USDT perpetual universe"
          git push origin HEAD:feature/kucoin-futures-only
