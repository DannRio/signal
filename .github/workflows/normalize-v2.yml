name: Normalize professional signal machine v2

on:
  push:
    branches: ["feature/professional-signal-machine-v2"]
    paths:
      - ".github/workflows/normalize-v2.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Normalize and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check src tests --fix
          python -m ruff check src tests
          python -m pytest -q
          python -m compileall -q src tests
          signal-bot --help >/dev/null
          signal-machine --help >/dev/null
          signal-api --help >/dev/null
          python -c "from importlib.resources import files; assert files('signal_bot').joinpath('web','index.html').is_file()"
      - name: Commit normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "Normalize professional signal machine v2"
          git push origin HEAD:feature/professional-signal-machine-v2
