name: Finalize KuCoin Futures scope

on:
  push:
    branches: ["feature/kucoin-futures-only"]
    paths:
      - ".github/workflows/finalize-kucoin-scope.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply final consistency fixes
        run: python tools/finalize_kucoin_scope.py

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check src tests tools --fix
          python -m ruff check src tests tools
          python -m pytest -q
          python -m compileall -q src tests tools
          signal-bot --help >/dev/null
          signal-machine --help >/dev/null
          signal-api --help >/dev/null

      - name: Commit final scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/finalize_kucoin_scope.py
          rm -f .github/workflows/finalize-kucoin-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize KuCoin Futures scope"
          git push origin HEAD:feature/kucoin-futures-only
