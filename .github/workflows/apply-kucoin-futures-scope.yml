name: Apply KuCoin Futures-only scope

on:
  push:
    branches: ["feature/kucoin-futures-only"]
    paths:
      - ".github/workflows/apply-kucoin-futures-scope.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Recover and apply migration script
        shell: bash
        run: |
          set -euo pipefail
          git show 8fddd6a5447f183b0f72db3fd1906ad0076b37ac:.github/workflows/apply-kucoin-futures-scope.yml > /tmp/original-workflow.yml
          awk '
            /python - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' /tmp/original-workflow.yml > /tmp/apply-kucoin-scope.py
          python /tmp/apply-kucoin-scope.py
          python - <<'PY'
          from pathlib import Path

          api_path = Path("src/signal_bot/api.py")
          api_source = api_path.read_text(encoding="utf-8")
          api_source = api_source.replace(
              "            market_type = DEFAULT_MARKET_TYPE\n",
              "",
          )
          api_path.write_text(api_source, encoding="utf-8")

          config_path = Path("src/signal_bot/config.py")
          config_source = config_path.read_text(encoding="utf-8")
          config_source = config_source.replace(
              "    fee_bps: float = 6.0\n    slippage_bps: float = 4.0\n",
              "    fee_bps: float = 10.0\n    slippage_bps: float = 5.0\n",
          )
          config_path.write_text(config_source, encoding="utf-8")

          json_path = Path("configs/default.json")
          json_source = json_path.read_text(encoding="utf-8")
          json_source = json_source.replace(
              '    "fee_bps": 6.0,\n    "slippage_bps": 4.0',
              '    "fee_bps": 10.0,\n    "slippage_bps": 5.0',
          )
          json_path.write_text(json_source, encoding="utf-8")

          readme_path = Path("README.md")
          readme_source = readme_path.read_text(encoding="utf-8")
          readme_source = readme_source.replace(
              "Default backtests use a 6 bps taker-fee estimate per side and "
              "4 bps slippage per side; adjust the configuration to match your "
              "actual fee tier and observed fills.",
              "Default backtests retain a conservative 10 bps fee estimate per "
              "side and 5 bps slippage per side; adjust the configuration only "
              "after documenting your actual fee tier and observed fills.",
          )
          readme_path.write_text(readme_source, encoding="utf-8")
          PY

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check src tests --fix
          python -m ruff check src tests
          python -m pytest -q
          python -m compileall -q src tests
          signal-bot --help >/dev/null
          signal-machine --help >/dev/null
          signal-api --help >/dev/null

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-kucoin-futures-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Scope signal machine to KuCoin Futures"
          git push origin HEAD:feature/kucoin-futures-only
