name: Apply KuCoin Futures-only scope

on:
  push:
    branches: ["feature/kucoin-futures-only"]
    paths:
      - ".github/workflows/apply-kucoin-futures-scope.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Recover and apply migration script
        shell: bash
        run: |
          set -euo pipefail
          git show 8fddd6a5447f183b0f72db3fd1906ad0076b37ac:.github/workflows/apply-kucoin-futures-scope.yml > /tmp/original-workflow.yml
          awk '
            /python - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' /tmp/original-workflow.yml > /tmp/apply-kucoin-scope.py
          python /tmp/apply-kucoin-scope.py

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check src tests --fix
          python -m ruff check src tests
          python -m pytest -q
          python -m compileall -q src tests
          signal-bot --help >/dev/null
          signal-machine --help >/dev/null
          signal-api --help >/dev/null

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-kucoin-futures-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Scope signal machine to KuCoin Futures"
          git push origin HEAD:feature/kucoin-futures-only
