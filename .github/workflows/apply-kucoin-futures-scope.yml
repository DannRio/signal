name: Apply KuCoin Futures-only scope

on:
  push:
    branches: ["feature/kucoin-futures-only"]
    paths:
      - ".github/workflows/apply-kucoin-futures-scope.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
