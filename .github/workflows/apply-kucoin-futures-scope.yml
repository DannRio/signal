          addition = anchor + "\n## Fixed venue scope\n\n- CCXT exchange id: `kucoinfutures`\n- Market type: `swap`\n- Supported settlement: `USDT`\n- Symbol format: `BTC/USDT:USDT` (the simpler `BTC/USDT` is normalized automatically)\n- KuCoin raw IDs such as `XBTUSDTM` are intentionally rejected at the user boundary\n- Public market data requires no API key; this project still does not place orders\n\nKuCoin's futures Kline endpoint returns at most 500 candles per request, so the downloader paginates at that limit. Default backtests use a 6 bps taker-fee estimate per side and 4 bps slippage per side; adjust the configuration to match your actual fee tier and observed fills. Historical funding settlements are not yet deducted from trade P&L, so no validation result should be treated as complete evidence for live futures deployment until funding is modeled.\n"
          if anchor not in text:
              raise RuntimeError("README insertion anchor not found")
          text = text.replace(anchor, addition, 1)
          readme.write_text(text, encoding="utf-8")

          # Focused regression tests.
          tests = '''from __future__ import annotations

import pytest

from signal_bot.machine_cli import _scan_request, build_parser
from signal_bot.venue import (
