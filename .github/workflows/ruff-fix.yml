name: One-time Ruff normalization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ruff-fix.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Correct FastAPI body declaration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/signal_bot/api.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "from fastapi import Body, FastAPI, HTTPException, Query",
              "from fastapi import FastAPI, HTTPException, Query",
          )
          source = source.replace(
              "        payload: dict[str, Any] = Body(...),\n",
              "        payload: dict[str, Any],\n",
          )
          path.write_text(source, encoding="utf-8")
          PY
      - name: Normalize and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check src tests --fix --unsafe-fixes
          python -m ruff check src tests
          python -m pytest -q
          python -m compileall -q src tests
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "Normalize lint and modern Python typing"
          git push origin HEAD:main
